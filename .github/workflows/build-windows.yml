name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - requirements-build.txt
      - 使用手冊.md
      - .github/workflows/build-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build desktop executable
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name FubonNeoMarketWindow
          --collect-all fubon_neo
          --collect-all fugle_marketdata
          app.py

      - name: Package and checksum
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "使用手冊.md" -Destination "dist\FubonNeoMarketWindow\使用手冊.md"
          Compress-Archive -Path "dist\FubonNeoMarketWindow" -DestinationPath "FubonNeoMarketWindow-v1.1.0-win64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "FubonNeoMarketWindow-v1.1.0-win64.zip").Hash
          "$hash  FubonNeoMarketWindow-v1.1.0-win64.zip" | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FubonNeoMarketWindow-v1.1.0-win64
          path: |
            FubonNeoMarketWindow-v1.1.0-win64.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "v1.1.0" --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload "v1.1.0" "FubonNeoMarketWindow-v1.1.0-win64.zip" "SHA256SUMS.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "v1.1.0" "FubonNeoMarketWindow-v1.1.0-win64.zip" "SHA256SUMS.txt" --title "看盤視窗 v1.1.0 Windows 免安裝版" --notes "下載 ZIP 並全部解壓縮後，執行 FubonNeoMarketWindow.exe。請保留 _internal 資料夾。使用正式下單前請先核對帳號、商品、方向與數量。" --repo "$env:GITHUB_REPOSITORY"
          }

